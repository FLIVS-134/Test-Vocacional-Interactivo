<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="/img/logo.png">

    <title>Test Vocacional Interactivo</title>

    <link rel="stylesheet" href="/css/estilos.css">

</head>

<body>

<header class="inicio-header">

    <div class="inicio-logo">
        <img src="/img/logo.png" alt="Logo Test Vocacional">
    </div>

    <nav class="inicio-nav">

        <a href="/index.html">
            Inicio
        </a>

        <a href="/index.html#como-funciona">
            ¿Cómo funciona?
        </a>

        <a href="/index.html#beneficios">
            Beneficios
        </a>

        <a href="/login.html" class="btn-login" id="enlaceSesion">Iniciar sesión</a>

    </nav>

</header>


<main class="test-container">

    <header class="test-header">
        <h1>Test <span>Vocacional</span></h1>

        <p>
            Descubre tus intereses, habilidades y áreas profesionales
            que podrían encajar contigo.
        </p>
    </header>


    <!-- PROGRESO -->

    <section class="progreso-contenedor">

        <div class="progreso-info">
            <span>Progreso</span>
            <span id="progresoTexto">0%</span>
        </div>

        <div class="progreso-barra">
            <div id="progreso"></div>
        </div>

    </section>


    <!-- PREGUNTAS -->

    <section id="preguntasContainer">

        <!-- Las preguntas serán cargadas mediante JavaScript -->

    </section>


    <!-- MENSAJE -->

    <div id="mensaje"></div>


    <!-- BOTONES -->

    <div class="botones-test">

        <button
            type="button"
            class="btn-test btn-secundario"
            id="btnAnterior">
            Anterior
        </button>

        <button
            type="button"
            class="btn-test btn-principal"
            id="btnSiguiente">
            Siguiente
        </button>

    </div>


    <!-- RESULTADO -->

    <section
        class="resultado-container"
        id="resultadoContainer">

        <h2>
            ¡Tu resultado está <span>listo!</span>
        </h2>

        <p id="resultadoTexto">
            Estamos analizando tus respuestas.
            ATT: Fabián, Luisa, Isabella, Valeria, Samuel.
        </p>

    </section>

</main>


<script>
    const enlaceSesion =
        document.getElementById("enlaceSesion");

    const usuarioGuardado =
        localStorage.getItem("usuario");

    if (usuarioGuardado) {

        enlaceSesion.textContent =
            "Cerrar sesión";

        enlaceSesion.href = "#";

        enlaceSesion.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                localStorage.removeItem("usuario");

                window.location.href =
                    "/login.html";
            }
        );
    }
</script>

<script src="/js/test.js"></script>

</body>
</html>
